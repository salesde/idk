[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-company"
version = "0.1.0"
description = "Fully autonomous AI agent company for revenue generation"
requires-python = ">=3.11"
dependencies = [
    # LangGraph orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    # LLM clients
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    # Tools
    "tavily-python>=0.3.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Validation & config
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # Dashboard
    "textual>=0.80.0",
    "rich>=13.8.0",
    # CLI
    "click>=8.1.0",
    # Utilities
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
]

[project.scripts]
ai-company = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["."]
